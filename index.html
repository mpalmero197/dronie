  <!-- Structured data: FAQ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is Dronie?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Dronie is a cloud-based drone photogrammetry platform that turns aerial imagery into georeferenced orthomosaics, 3D point clouds, digital surface models (DSM), digital terrain models (DTM), contour maps, and Gaussian splats. It also includes terrain-aware flight planning, fleet management with live telemetry, a pilot marketplace with Stripe Connect payouts, and a public portfolio site for every operator at dronieapp.com/u/your-name."
        }
      },
      {
        "@type": "Question",
        "name": "How does drone photogrammetry work on Dronie?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "You plan a survey on the in-app map with terrain-following waypoints, fly the mission with any DJI, Autel, Parrot, or senseFly drone, then drag-and-drop the JPEGs or TIFFs into a project. Our pipeline runs Structure-from-Motion (SfM) and Multi-View Stereo (MVS) on the imagery to align cameras, build a dense point cloud, and stitch a georeferenced orthomosaic. Outputs are exported as GeoTIFF, LAS/LAZ, SHP, DXF, and KMZ — compatible with ArcGIS, QGIS, AutoCAD, and CloudCompare."
        }
      },
      {
        "@type": "Question",
        "name": "How fast can I get my 3D models processed?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Dronieapp is optimized for speed and typically delivers processed orthomosaics and 3D models in under an hour for standard 500-image flight datasets, and in 90 minutes or less for 1,200-image surveys. By leveraging high-performance cloud computing, it eliminates the GPU and RAM bottlenecks of traditional desktop photogrammetry software like Pix4D or Agisoft Metashape — typically 3–5× faster end-to-end."
        }
      },
      {
        "@type": "Question",
        "name": "How is Dronie different from DroneDeploy or Maps Made Easy?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Dronie is faster and significantly cheaper than DroneDeploy and Maps Made Easy for the same outputs. There is no desktop install, no per-image surcharge on the free tier, and Gaussian splat training is included on paid plans — most competitors charge separately or do not support splats at all. Dronie also bundles a public pilot marketplace, portfolio sites, and fleet telemetry that traditional photogrammetry tools do not offer."
        }
      },
      {
        "@type": "Question",
        "name": "How much does Dronie cost?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The Free plan includes 3 projects per month with up to 500 images per project — no credit card required. The Professional plan is $49/month and unlocks unlimited projects, priority processing, 50 GB of storage, and Gaussian splat training. The Enterprise plan is $149/month and adds unlimited images per project, API access, a white-label embeddable viewer, and an SLA guarantee. Marketplace clients pay a flat 1% platform fee on top of the pilot's quoted price."
        }
      },
      {
        "@type": "Question",
        "name": "What file formats and drones are supported?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Dronie accepts JPEG, TIFF, and DNG imagery from any consumer or enterprise UAV, including the full DJI lineup (Mavic, Air, Mini, Phantom, Matrice), Autel EVO series, Parrot Anafi, and senseFly eBee. Outputs include GeoTIFF orthomosaics, LAS/LAZ point clouds, GeoTIFF DSM and DTM rasters, SHP/DXF/KMZ contour lines, .ply / .splat / .ksplat Gaussian splats, and a one-page flight report PDF."
        }
      },
      {
        "@type": "Question",
        "name": "Which CAD and GIS software does Dronieapp integrate with?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Dronieapp's outputs are designed to drop straight into the tools surveyors and engineers already use. GeoTIFF orthomosaics and DSM/DTM rasters open natively in Esri ArcGIS Pro, QGIS, and Global Mapper. LAS/LAZ point clouds work in CloudCompare, Trimble Business Center, Bentley ContextCapture, and Autodesk ReCap. DXF, SHP, and KMZ contour lines import directly into AutoCAD, Civil 3D, Carlson, and Revit. OBJ and FBX textured meshes work in Blender, 3ds Max, Unreal Engine, and Unity."
        }
      },
      {
        "@type": "Question",
        "name": "Is Dronie compliant with FAA Part 107 and LAANC?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Dronie's compliance dashboard tracks Part 107 certifications, biennial recurrent training dates, drone registration numbers, and maintenance cycles. Flight planning includes built-in LAANC airspace classification overlays so you can confirm controlled-airspace authorization before launch. Pilot data is stored encrypted and is GDPR-friendly."
        }
      },
      {
        "@type": "Question",
        "name": "Can I hire a drone pilot through Dronie?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. The Dronie Marketplace connects clients with verified Part 107 pilots worldwide. Browse the live pilot map, view public portfolios, request a quote, and pay securely through Stripe Connect — pilots receive their full asking price and the client pays a 1% connection fee. Higher subscription tiers get first access to new client requests."
        }
      }
    ]
  }
  </script>
